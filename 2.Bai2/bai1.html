<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bải thực hành 1</title>
  </head>
  <body>
    <script>
      let total = 0;
      let num = 0;
      while (true) {
        num = parseInt(prompt("Enter a number:"));
        if (num === -1) {
          break;
        }
        total += num;
      }
      alert(total);
    </script>
  </body>
</html>
